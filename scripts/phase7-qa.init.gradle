// Explicit offline QA invocation only. Not loaded by any production/release build.
allprojects {
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'androidx.test' && details.requested.name == 'runner') {
                details.useVersion('1.3.0')
                details.because('Offline Phase 7 QA, already cached matching Flutter integration artifact')
            }
        }
    }
}
