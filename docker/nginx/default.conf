map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80 default_server;
  server_name _;
  return 444;
}

server {
  listen 80;
  server_name ${PRODUCTION_DOMAIN};
  return 308 https://${PRODUCTION_DOMAIN}$request_uri;
}

server {
  listen 443 ssl default_server;
  server_name _;
  ssl_reject_handshake on;
}

server {
  listen 443 ssl;
  http2 on;
  server_name ${PRODUCTION_DOMAIN};
  root /usr/share/nginx/html;

  ssl_certificate /run/secrets/tls-fullchain.pem;
  ssl_certificate_key /run/secrets/tls-private-key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:TLS:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  proxy_hide_header X-Powered-By;

  client_max_body_size 10m;
  proxy_connect_timeout 10s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;

  location = /privacy {
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header Cache-Control "public, max-age=300" always;
    try_files /legal/privacy-policy.html =404;
  }

  location = /account-deletion {
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header Cache-Control "no-store" always;
    try_files /legal/account-deletion.html =404;
  }

  location /legal/ {
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  location /socket.io/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
